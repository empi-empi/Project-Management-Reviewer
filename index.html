<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project Management Reviewer</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--ink:#1b2430;--mute:#66707e;--line:#d9dee6;--acc:#1f5eff;--accbg:#e6edff;--ok:#12805c;--okbg:#e0f4ec;--bad:#c23030;--badbg:#fbe6e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b212a;--ink:#e8ecf2;--mute:#9aa4b2;--line:#2b3340;--acc:#6e97ff;--accbg:#1f2a47;--ok:#4cc79a;--okbg:#14332a;--bad:#ff8080;--badbg:#3a1d1d}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b212a;--ink:#e8ecf2;--mute:#9aa4b2;--line:#2b3340;--acc:#6e97ff;--accbg:#1f2a47;--ok:#4cc79a;--okbg:#14332a;--bad:#ff8080;--badbg:#3a1d1d}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:4px 0 12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;color:var(--ink);padding:9px 14px;font:inherit;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--acc);color:#fff}
select,input[type=search],input[type=text]{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
label.chk{display:flex;gap:6px;align-items:center;color:var(--mute);font-size:.9rem}
button{font:inherit}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.btn.no{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.meta{color:var(--mute);font-size:.85rem;margin-bottom:6px}
.q{font-size:1.1rem;font-weight:600;margin:0 0 12px}
.ans{color:var(--ok);font-weight:600}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:11px 14px;margin-bottom:8px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.right{background:var(--okbg);border-color:var(--ok)}.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{flex:1}
.prog{height:6px;background:var(--line);border-radius:3px;margin:0 0 12px;overflow:hidden}.prog i{display:block;height:100%;background:var(--acc)}
.flash{min-height:200px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;text-align:center}
.big{font-size:1.5rem;font-weight:700;margin:6px 0}
.fb{padding:10px 12px;border-radius:10px;margin:8px 0}.fb.ok{background:var(--okbg)}.fb.no{background:var(--badbg)}
</style></head><body><main>
<h1>Project Management Reviewer</h1>
<div class="bar">
 <div class="seg" id="setSeg"><button data-v="mc">Multiple choice</button><button data-v="id">Identification</button></div>
 <div class="seg" id="modeSeg"><button data-v="study">Study</button><button data-v="flash">Flashcards</button><button data-v="quiz">Quiz</button></div>
</div>
<div class="bar">
 <select id="cat" aria-label="Topic"></select>
 <label class="chk"><input type="checkbox" id="shuf"> Shuffle</label>
 <span class="sp"></span><span class="meta" id="count"></span>
</div>
<div id="view"></div>
</main>
<script>
const DATA={"mc": [{"n": 1, "c": "Project Fundamentals", "q": "What is defined as a temporary endeavor undertaken to create a unique product, service, or result?", "o": ["A. Operation", "B. Project", "C. Process", "D. System"], "a": 1}, {"n": 2, "c": "Project Fundamentals", "q": "Which characteristic distinguishes a project from routine ongoing operations?", "o": ["A. Continuous repetitive output", "B. Temporary nature with a definite start and end", "C. Unchanging budget allocation", "D. Functional department structure"], "a": 1}, {"n": 3, "c": "Project Fundamentals", "q": "In engineering and business, projects utilize key resource inputs primarily to achieve what?", "o": ["A. Indefinite operational cycles", "B. A tangible or specific objective", "C. Maximum organizational hierarchy", "D. Elimination of all business risk"], "a": 1}, {"n": 4, "c": "Project Fundamentals", "q": "Which of the following is considered a primary constraint in the traditional project management 'Triple Constraint'?", "o": ["A. Market share", "B. Scope, Time, and Cost", "C. Employee satisfaction", "D. Corporate policy"], "a": 1}, {"n": 5, "c": "Project Fundamentals", "q": "When project managers balance scope, time, and cost, what fourth element is directly affected by trade-offs among them?", "o": ["A. Quality", "B. Depreciation", "C. Taxation", "D. Seniority"], "a": 0}, {"n": 6, "c": "Project Fundamentals", "q": "What is the consequence of failing to apply structured project management principles to technical initiatives?", "o": ["A. Guaranteed success", "B. Missed deadlines, interpersonal friction, and budget overruns", "C. Automatic scope reduction", "D. Increased profit margins"], "a": 1}, {"n": 7, "c": "Project Fundamentals", "q": "In contrast to projects, day-to-day business operations are described as:", "o": ["A. Unique and temporary", "B. Ongoing and repetitive", "C. Goal-focused without routine", "D. Ad-hoc and unstructured"], "a": 1}, {"n": 8, "c": "Project Fundamentals", "q": "Which factor defines project scope?", "o": ["A. The total money spent", "B. The specific work required to deliver a product/service with specified features", "C. The timeline specified in Gantt charts", "D. The interest rate of financing"], "a": 1}, {"n": 9, "c": "Project Fundamentals", "q": "What term describes the gradual, unapproved expansion of project scope without adjustments to time or budget?", "o": ["A. Scope creep", "B. Scope reduction", "C. Gold plating", "D. Fast tracking"], "a": 0}, {"n": 10, "c": "Project Fundamentals", "q": "What is the primary purpose of defining clear project deliverables early in the project?", "o": ["A. To eliminate all stakeholder involvement", "B. To establish measurable criteria for project completion and acceptance", "C. To prevent team members from communicating", "D. To reduce quality control standards"], "a": 1}, {"n": 11, "c": "Project Fundamentals", "q": "Which stakeholder group provides the financial resources and executive backing for a project?", "o": ["A. Project Sponsor", "B. End Users", "C. Quality Inspector", "D. Functional Supervisor"], "a": 0}, {"n": 12, "c": "Project Fundamentals", "q": "A project is considered successful when it:", "o": ["A. Expands scope continuously", "B. Achieves objectives within approved time, budget, and quality standards", "C. Uses all contingency reserves regardless of need", "D. Eliminates all documentation"], "a": 1}, {"n": 13, "c": "Project Fundamentals", "q": "What is the main driver for initiating new projects in an organization?", "o": ["A. Random team requests", "B. Strategic business needs, technological advances, or market demands", "C. Excess budget capital that must be spent", "D. Routine monthly maintenance"], "a": 1}, {"n": 14, "c": "Project Fundamentals", "q": "Which element is essential for defining a project's temporary nature?", "o": ["A. A fixed location", "B. Defined start and end dates", "C. Permanent staffing", "D. Annual renewal terms"], "a": 1}, {"n": 15, "c": "Project Fundamentals", "q": "What does 'uniqueness' mean in the context of project deliverables?", "o": ["A. It has never been attempted anywhere in history", "B. The deliverable has distinct features or conditions separate from routine products", "C. It uses no standard materials", "D. It cannot be tested"], "a": 1}, {"n": 16, "c": "Project Fundamentals", "q": "Which document formally authorizes the existence of a project and provides the project manager with authority?", "o": ["A. Project Charter", "B. Risk Register", "C. Work Breakdown Structure", "D. Change Order"], "a": 0}, {"n": 17, "c": "Project Fundamentals", "q": "Project management is best defined as the application of what to meet project requirements?", "o": ["A. Knowledge, skills, tools, and techniques", "B. Raw computing power and software alone", "C. Strict military hierarchy", "D. Unplanned trial and error"], "a": 0}, {"n": 18, "c": "Project Fundamentals", "q": "Which factor is most likely to cause a project to fail early in its lifecycle?", "o": ["A. Over-documented requirements", "B. Unclear or changing project objectives", "C. Excessive team communication", "D. Too much sponsor involvement"], "a": 1}, {"n": 19, "c": "Project Fundamentals", "q": "What type of asset is produced when a construction project concludes?", "o": ["A. Operational procedure", "B. Tangible capital asset / infrastructure", "C. Temporary draft", "D. Recurring service contract"], "a": 1}, {"n": 20, "c": "Project Fundamentals", "q": "Which entity suffers when project risk is completely unmanaged?", "o": ["A. Project schedule, cost, and deliverable quality", "B. Only external suppliers", "C. Only regulatory agencies", "D. Competitors in the market"], "a": 0}, {"n": 21, "c": "Project Fundamentals", "q": "What is progressive elaboration in project planning?", "o": ["A. Adding cost every week automatically", "B. Continuously refining and detailing plans as more information becomes available", "C. Postponing work until the deadline", "D. Changing the project manager every phase"], "a": 1}, {"n": 22, "c": "Project Fundamentals", "q": "Which aspect of project management ensures that project deliverables align with organizational strategy?", "o": ["A. Strategic Alignment / Portfolio Management", "B. Daily task scheduling", "C. Micro-managing developers", "D. Individual performance appraisal"], "a": 0}, {"n": 23, "c": "Project Fundamentals", "q": "A project baseline refers to the approved version of what?", "o": ["A. Scope, Schedule, and Cost plans used for performance comparison", "B. Initial draft requirements", "C. Unapproved team ideas", "D. Vendor marketing brochures"], "a": 0}, {"n": 24, "c": "Project Fundamentals", "q": "Why are projects categorized into distinct phases?", "o": ["A. To delay work as long as possible", "B. To provide management control checkpoints and logical groupings of activities", "C. To increase paperwork", "D. To avoid paying vendors on time"], "a": 1}, {"n": 25, "c": "Project Fundamentals", "q": "What is the primary role of a Project Management Office (PMO)?", "o": ["A. To replace all project managers", "B. To standardize project governance and facilitate resource sharing and best practices", "C. To inspect daily code lines", "D. To handle corporate taxation"], "a": 1}, {"n": 26, "c": "PM Principles & Roles", "q": "What is the ultimate accountability of the Project Manager?", "o": ["A. Writing all technical code", "B. Ensuring the project achieves its objectives within constraints", "C. Approving executive compensation", "D. Performing audit reporting for corporate finance"], "a": 1}, {"n": 27, "c": "PM Principles & Roles", "q": "In a functional organization, who typically holds the majority of resource authority?", "o": ["A. Project Manager", "B. Functional Manager", "C. External Consultant", "D. Scrum Master"], "a": 1}, {"n": 28, "c": "PM Principles & Roles", "q": "In a projectized organization structure, where do team members report?", "o": ["A. Exclusively to Functional Department Heads", "B. Directly to the Project Manager for the project duration", "C. To external auditors", "D. To human resource generalists only"], "a": 1}, {"n": 29, "c": "PM Principles & Roles", "q": "What is a matrix organization structure designed to balance?", "o": ["A. Functional efficiency and project-focused delivery", "B. Profit margins and employee tax rates", "C. Vendor contracts and government grants", "D. Internal sales and external marketing"], "a": 0}, {"n": 30, "c": "PM Principles & Roles", "q": "In a strong matrix organization, who possesses greater authority over project resources?", "o": ["A. Functional Manager", "B. Project Manager", "C. Administrative Assistant", "D. Subcontractor"], "a": 1}, {"n": 31, "c": "PM Principles & Roles", "q": "What term describes key individuals or organizations actively involved in or impacted by the project?", "o": ["A. Stakeholders", "B. Subcontractors", "C. Competitors", "D. Regulators"], "a": 0}, {"n": 32, "c": "PM Principles & Roles", "q": "Which project management principle emphasizes proactive identification and mitigation of threats?", "o": ["A. Reactive firefighting", "B. Risk Management", "C. Gold plating", "D. Unilateral decision-making"], "a": 1}, {"n": 33, "c": "PM Principles & Roles", "q": "What is the main purpose of stakeholder analysis during project planning?", "o": ["A. To assign blame for past failures", "B. To identify stakeholder interests, influence, and communication needs", "C. To determine salary levels", "D. To eliminate external reviews"], "a": 1}, {"n": 34, "c": "PM Principles & Roles", "q": "Which key skill allows project managers to align diverse stakeholders towards a shared vision?", "o": ["A. Leadership and Communication", "B. Manual drafting", "C. Single-entry bookkeeping", "D. Hardware soldering"], "a": 0}, {"n": 35, "c": "PM Principles & Roles", "q": "When a project manager practices ethical decision-making, which core values guide their actions?", "o": ["A. Responsibility, respect, fairness, and honesty", "B. Profit maximization at any cost", "C. Secrecy and isolation", "D. Favoritism and speed"], "a": 0}, {"n": 36, "c": "PM Principles & Roles", "q": "What is the primary focus of the Project Sponsor during the project lifecycle?", "o": ["A. Writing technical scripts", "B. Advocating for the business value, funding, and executive alignment of the project", "C. Setting daily task rosters", "D. Inspecting individual deliverables"], "a": 1}, {"n": 37, "c": "PM Principles & Roles", "q": "What happens when a project manager lacks positional authority in a weak matrix?", "o": ["A. The PM acts primarily as a project coordinator or expediter", "B. The project automatically succeeds faster", "C. All budget control transfers to the PM", "D. Team members are terminated"], "a": 0}, {"n": 38, "c": "PM Principles & Roles", "q": "Which communication channel count formula calculates total potential channels ($n$ stakeholders)?", "o": ["A. $n(n-1)/2$", "B. $n^2$", "C. $n(n+1)/2$", "D. $2n-1$"], "a": 0}, {"n": 39, "c": "PM Principles & Roles", "q": "If a project team expands from 4 to 8 stakeholders, how many communication channels are added?", "o": ["A. 4", "B. 22", "C. 16", "D. 28"], "a": 1}, {"n": 40, "c": "PM Principles & Roles", "q": "What is the primary goal of team development models such as Tuckman's model (Forming, Storming, Norming, Performing)?", "o": ["A. To transition the team into a high-performing unit", "B. To increase interpersonal conflict", "C. To shorten the planning phase", "D. To reduce team size"], "a": 0}, {"n": 41, "c": "PM Principles & Roles", "q": "During which Tuckman stage do team members experience conflict over roles and approaches?", "o": ["A. Forming", "B. Storming", "C. Norming", "D. Performing"], "a": 1}, {"n": 42, "c": "PM Principles & Roles", "q": "What characterizes the 'Norming' stage of team development?", "o": ["A. Confusion about goals", "B. Team members resolve friction, establish trust, and agree on working standards", "C. Disbandment of the team", "D. Initial orientation"], "a": 1}, {"n": 43, "c": "PM Principles & Roles", "q": "Which management style is characterized by giving the team high autonomy when they are highly skilled?", "o": ["A. Autocratic", "B. Laissez-faire / Delegative", "C. Dictatorial", "D. Bureaucratic"], "a": 1}, {"n": 44, "c": "PM Principles & Roles", "q": "What conflict resolution technique seeks a win-win solution where both parties work together?", "o": ["A. Collaborating / Problem Solving", "B. Forcing / Directing", "C. Avoiding / Withdrawing", "D. Smoothing / Accommodating"], "a": 0}, {"n": 45, "c": "PM Principles & Roles", "q": "Which conflict resolution approach pushes one's viewpoint at the expense of others (win-lose)?", "o": ["A. Forcing / Competing", "B. Compromising", "C. Collaborating", "D. Smoothing"], "a": 0}, {"n": 46, "c": "PM Principles & Roles", "q": "What is the main limitation of the 'Compromising' conflict resolution style?", "o": ["A. It requires full consensus", "B. Both sides give up something, resulting in a lose-lose or partial satisfaction", "C. It takes months to implement", "D. It forces total agreement"], "a": 1}, {"n": 47, "c": "PM Principles & Roles", "q": "How should a Project Manager handle high-power, high-interest stakeholders?", "o": ["A. Keep informed via passive email", "B. Manage closely and engage actively", "C. Monitor with minimal effort", "D. Ignore until project completion"], "a": 1}, {"n": 48, "c": "PM Principles & Roles", "q": "How should stakeholders with low power and high interest be managed?", "o": ["A. Manage closely", "B. Keep informed", "C. Keep satisfied", "D. Monitor with minimal effort"], "a": 1}, {"n": 49, "c": "PM Principles & Roles", "q": "What is the primary focus of emotional intelligence (EQ) in project leadership?", "o": ["A. Memorizing technical user manuals", "B. Understanding and managing one's own emotions and empathy for team members", "C. Calculating financial depreciation", "D. Writing complex SQL code"], "a": 1}, {"n": 50, "c": "PM Principles & Roles", "q": "Servant leadership in agile project management focuses primarily on:", "o": ["A. Controlling all team assignments centrally", "B. Serving the team by removing obstacles and empowering team growth", "C. Enforcing corporate penalties", "D. Minimizing team interaction"], "a": 1}, {"n": 51, "c": "PM Tools & Techniques", "q": "What is a Work Breakdown Structure (WBS)?", "o": ["A. A chronological list of project milestones", "B. A hierarchical decomposition of the total scope of work to be carried out", "C. A financial audit ledger", "D. An organizational chart of functional managers"], "a": 1}, {"n": 52, "c": "PM Tools & Techniques", "q": "What is the lowest level of a Work Breakdown Structure called?", "o": ["A. Milestone", "B. Work Package", "C. Project Activity", "D. Task Group"], "a": 1}, {"n": 53, "c": "PM Tools & Techniques", "q": "What rule states that the WBS must encompass 100% of the work defined by the project scope?", "o": ["A. The 80/20 Rule", "B. The 100% Rule", "C. The Critical Path Rule", "D. The Parkinson's Law"], "a": 1}, {"n": 54, "c": "PM Tools & Techniques", "q": "What document accompanies the WBS to provide detailed descriptions of each component/work package?", "o": ["A. WBS Dictionary", "B. Project Charter", "C. Risk Register", "D. Procurement Log"], "a": 0}, {"n": 55, "c": "PM Tools & Techniques", "q": "What is a Gantt chart primarily used for in project management?", "o": ["A. Calculating corporate tax", "B. Illustrating project schedule against time using horizontal bars", "C. Mapping entity-relationship diagrams", "D. Evaluating employee salary history"], "a": 1}, {"n": 56, "c": "PM Tools & Techniques", "q": "What visual tool uses columns such as 'To Do', 'In Progress', and 'Done' to limit work-in-progress (WIP)?", "o": ["A. Gantt Chart", "B. Kanban Board", "C. Pareto Chart", "D. Ishikawa Diagram"], "a": 1}, {"n": 57, "c": "PM Tools & Techniques", "q": "What is the primary objective of Work In Progress (WIP) limits in Kanban?", "o": ["A. To stop team members from working", "B. To prevent bottlenecks and improve workflow efficiency", "C. To increase project cost", "D. To delay deliverable approval"], "a": 1}, {"n": 58, "c": "PM Tools & Techniques", "q": "What project management tool documents identified risks, their severity, likelihood, and response strategies?", "o": ["A. Risk Register", "B. Issue Log", "C. Scope Baseline", "D. Responsibility Assignment Matrix (RAM)"], "a": 0}, {"n": 59, "c": "PM Tools & Techniques", "q": "What is the formula for calculating Risk Exposure / Risk Score?", "o": ["A. Risk Probability x Risk Impact", "B. Risk Duration / Project Cost", "C. Total Budget - Actual Cost", "D. Slack Time + Free Float"], "a": 0}, {"n": 60, "c": "PM Tools & Techniques", "q": "Which risk response strategy involves changing the project plan to eliminate the threat entirely?", "o": ["A. Risk Mitigation", "B. Risk Avoidance", "C. Risk Acceptance", "D. Risk Transference"], "a": 1}, {"n": 61, "c": "PM Tools & Techniques", "q": "Purchasing insurance or issuing a warranty to a third party is an example of which risk response?", "o": ["A. Risk Transference", "B. Risk Mitigation", "C. Risk Avoidance", "D. Risk Exploitation"], "a": 0}, {"n": 62, "c": "PM Tools & Techniques", "q": "Taking active steps to reduce the probability or impact of a negative risk is known as:", "o": ["A. Risk Avoidance", "B. Risk Mitigation", "C. Risk Acceptance", "D. Risk Enhancement"], "a": 1}, {"n": 63, "c": "PM Tools & Techniques", "q": "Choosing not to alter project plans but establishing a contingency reserve for a risk is:", "o": ["A. Active Risk Acceptance", "B. Risk Avoidance", "C. Risk Transference", "D. Risk Elimination"], "a": 0}, {"n": 64, "c": "PM Tools & Techniques", "q": "What positive risk (opportunity) response strategy ensures that the opportunity is definitely realized?", "o": ["A. Exploit", "B. Share", "C. Enhance", "D. Ignore"], "a": 0}, {"n": 65, "c": "PM Tools & Techniques", "q": "What matrix maps project deliverables/tasks to team roles using Responsible, Accountable, Consulted, Informed?", "o": ["A. RACI Matrix", "B. SWAT Matrix", "C. Ansoff Matrix", "D. BCG Matrix"], "a": 0}, {"n": 66, "c": "PM Tools & Techniques", "q": "In a RACI matrix, how many roles should be designated as 'Accountable' for a single task?", "o": ["A. Multiple roles", "B. Exactly one role", "C. All team members", "D. Zero roles"], "a": 1}, {"n": 67, "c": "PM Tools & Techniques", "q": "What does the 'C' stand for in a RACI Matrix?", "o": ["A. Control", "B. Consulted", "C. Coordinated", "D. Completed"], "a": 1}, {"n": 68, "c": "PM Tools & Techniques", "q": "Which root-cause analysis tool is also known as a Fishbone or Cause-and-Effect Diagram?", "o": ["A. Ishikawa Diagram", "B. Histogram", "C. Scatter Diagram", "D. Flowchart"], "a": 0}, {"n": 69, "c": "PM Tools & Techniques", "q": "What quality chart operates on the 80/20 rule to rank defect causes by frequency?", "o": ["A. Pareto Chart", "B. Control Chart", "C. Gantt Chart", "D. Run Chart"], "a": 0}, {"n": 70, "c": "PM Tools & Techniques", "q": "What tool tracks performance over time between upper and lower control limits?", "o": ["A. Control Chart", "B. Mind Map", "C. RACI Chart", "D. Milestone List"], "a": 0}, {"n": 71, "c": "PM Tools & Techniques", "q": "What estimation technique uses three values: Optimistic (O), Most Likely (M), and Pessimistic (P)?", "o": ["A. PERT / Three-Point Estimating", "B. Analogous Estimating", "C. Parametric Estimating", "D. Bottom-Up Estimating"], "a": 0}, {"n": 72, "c": "PM Tools & Techniques", "q": "What is the standard Beta PERT weighted average formula?", "o": ["A. $(O + M + P) / 3$", "B. $(O + 4M + P) / 6$", "C. $(O + 2M + P) / 4$", "D. $(P - O) / 6$"], "a": 1}, {"n": 73, "c": "PM Tools & Techniques", "q": "What estimating technique uses historical data from a similar past project to estimate current duration/cost?", "o": ["A. Analogous Estimating", "B. Bottom-Up Estimating", "C. Parametric Estimating", "D. Three-Point Estimating"], "a": 0}, {"n": 74, "c": "PM Tools & Techniques", "q": "Which estimation method calculates total duration/cost by aggregating estimates of individual work packages?", "o": ["A. Bottom-Up Estimating", "B. Top-Down Estimating", "C. Rough Order of Magnitude", "D. Expert Judgment"], "a": 0}, {"n": 75, "c": "PM Tools & Techniques", "q": "What estimating technique uses a mathematical algorithm based on historical parameters (e.g., cost per sq meter)?", "o": ["A. Parametric Estimating", "B. Analogous Estimating", "C. Delphic Method", "D. Heuristic Estimating"], "a": 0}, {"n": 76, "c": "Project Lifecycle", "q": "What is the first phase of the standard project management lifecycle?", "o": ["A. Planning", "B. Initiation", "C. Execution", "D. Closing"], "a": 1}, {"n": 77, "c": "Project Lifecycle", "q": "Which key activity takes place during the Project Initiation phase?", "o": ["A. Developing the full detailed schedule", "B. Defining project feasibility, business case, and securing the Project Charter", "C. Managing vendor contracts day-to-day", "D. Conducting final product handover"], "a": 1}, {"n": 78, "c": "Project Lifecycle", "q": "What primary deliverable marks the transition from Initiation to the Planning phase?", "o": ["A. Approved Project Charter", "B. Signed Final Report", "C. Earned Value Analysis Report", "D. Change Request Form"], "a": 0}, {"n": 79, "c": "Project Lifecycle", "q": "During which phase of the project lifecycle is the majority of the project budget expended?", "o": ["A. Initiation", "B. Planning", "C. Execution", "D. Closing"], "a": 2}, {"n": 80, "c": "Project Lifecycle", "q": "What is the core purpose of the Project Planning phase?", "o": ["A. To finalize deliverables and disband team", "B. To establish scope, baseline schedule, budget, and management plans", "C. To execute raw work without rules", "D. To perform project kickoff review with auditors only"], "a": 1}, {"n": 81, "c": "Project Lifecycle", "q": "What project management process group runs concurrently with Execution to measure performance and manage changes?", "o": ["A. Monitoring and Controlling", "B. Pre-Initiation", "C. Post-Closing", "D. Feasibility Analysis"], "a": 0}, {"n": 82, "c": "Project Lifecycle", "q": "What is a formal event held at the end of the Planning phase to align team members and stakeholders?", "o": ["A. Project Kickoff Meeting", "B. Retrospective / Closing Meeting", "C. Contract Bidding Workshop", "D. Audit Review"], "a": 0}, {"n": 83, "c": "Project Lifecycle", "q": "Which phase involves coordinating resources, managing stakeholder expectations, and integrating activities?", "o": ["A. Execution", "B. Initiation", "C. Closing", "D. Conceptualization"], "a": 0}, {"n": 84, "c": "Project Lifecycle", "q": "What action should be taken when project variance exceeds acceptable thresholds during Monitoring and Controlling?", "o": ["A. Ignore the variance", "B. Implement corrective or preventive actions through change control", "C. Cancel the project immediately", "D. Change the past baseline retroactively"], "a": 1}, {"n": 85, "c": "Project Lifecycle", "q": "What essential activity occurs during the Project Closing phase?", "o": ["A. Drafting the initial business case", "B. Obtaining formal stakeholder acceptance, releasing resources, and documenting lessons learned", "C. Developing the initial WBS", "D. Setting initial baseline budget"], "a": 1}, {"n": 86, "c": "Project Lifecycle", "q": "Why is capturing 'Lessons Learned' crucial during project closing?", "o": ["A. To fulfill administrative bureaucracy", "B. To improve future project performance and organizational knowledge", "C. To penalize low-performing contractors", "D. To increase current project scope"], "a": 1}, {"n": 87, "c": "Project Lifecycle", "q": "What document signifies that the client or sponsor formally accepts project deliverables?", "o": ["A. Acceptance Sign-off / Certificate of Completion", "B. Initial Project Charter", "C. Draft Requirements Document", "D. Purchase Order"], "a": 0}, {"n": 88, "c": "Project Lifecycle", "q": "What happens to project resources at the conclusion of the Closing phase?", "o": ["A. They are held in permanent limbo", "B. They are released and reassigned to other projects or operational duties", "C. They are automatically terminated from the firm", "D. They continue charging cost to the closed project"], "a": 1}, {"n": 89, "c": "Project Lifecycle", "q": "A gate check or phase review at the end of a lifecycle phase is intended to determine:", "o": ["A. Whether the project should proceed to the next phase, be modified, or terminated", "B. Employee bonus compensation", "C. Daily task schedules for developers", "D. Immediate release of all funds"], "a": 0}, {"n": 90, "c": "Project Lifecycle", "q": "Which lifecycle model is strictly sequential, where each phase must be completed before the next begins?", "o": ["A. Waterfall Model", "B. Agile / Iterative Model", "C. Spiral Model", "D. Extreme Programming"], "a": 0}, {"n": 91, "c": "Project Lifecycle", "q": "Which project lifecycle model delivers functionality in short, incremental iterations (sprints)?", "o": ["A. Agile / Adaptive Lifecycle", "B. Waterfall Lifecycle", "C. Predictive Lifecycle", "D. Linear Sequential Lifecycle"], "a": 0}, {"n": 92, "c": "Project Lifecycle", "q": "When is a predictive (Waterfall) lifecycle most appropriate?", "o": ["A. When requirements are well-understood, stable, and fixed", "B. When requirements are highly volatile and unknown", "C. When the product must ship daily", "D. When end-users refuse to define requirements"], "a": 0}, {"n": 93, "c": "Project Lifecycle", "q": "When is an adaptive (Agile) lifecycle most beneficial?", "o": ["A. When projects face high uncertainty, evolving scope, and require rapid feedback", "B. When building traditional heavy civil infrastructure with rigid specs", "C. When no stakeholders are available", "D. When time and budget are infinite"], "a": 0}, {"n": 94, "c": "Project Lifecycle", "q": "What term describes the milestone where the project deliverable transitions to operational support?", "o": ["A. Handover / Operational Transition", "B. Kickoff", "C. Requirements Freeze", "D. Feasibility Sign-off"], "a": 0}, {"n": 95, "c": "Project Lifecycle", "q": "What is the primary risk of skipping formal project closure?", "o": ["A. Unreleased liabilities, continued cost accrual, and lost organizational learning", "B. Reduced project scope", "C. Faster project execution", "D. Immediate bonus distribution"], "a": 0}, {"n": 96, "c": "Project Lifecycle", "q": "Which document defines how project scope will be defined, validated, and controlled?", "o": ["A. Scope Management Plan", "B. Cost Baseline", "C. Communication Matrix", "D. Resource Histogram"], "a": 0}, {"n": 97, "c": "Project Lifecycle", "q": "In which phase are project risks first systematically identified?", "o": ["A. Initiation and early Planning", "B. Closing", "C. Post-Implementation", "D. Procurement Audit"], "a": 0}, {"n": 98, "c": "Project Lifecycle", "q": "What document details stakeholder communication constraints, frequency, and distribution channels?", "o": ["A. Communications Management Plan", "B. Quality Control Plan", "C. Procurement Statement of Work", "D. Bill of Materials"], "a": 0}, {"n": 99, "c": "Project Lifecycle", "q": "When is stakeholder influence on project cost and product characteristics highest?", "o": ["A. At project Initiation and early Planning", "B. During project Closing", "C. During final testing", "D. After hand-off"], "a": 0}, {"n": 100, "c": "Project Lifecycle", "q": "When is the cost of changing project requirements highest?", "o": ["A. During early Initiation", "B. Late in Execution / near project completion", "C. During initial brainstorming", "D. Before charter approval"], "a": 1}, {"n": 101, "c": "Network Planning", "q": "What is the main objective of network planning in project management?", "o": ["A. To design physical computer networks", "B. To map out activity dependencies and sequence work for efficient scheduling", "C. To structure executive payroll", "D. To eliminate project documentation"], "a": 1}, {"n": 102, "c": "Network Planning", "q": "In network diagrams, what does an 'Activity' represent?", "o": ["A. An instantaneous point in time with zero duration", "B. An element of work that consumes time and resources", "C. The project manager's job title", "D. A corporate policy milestone"], "a": 1}, {"n": 103, "c": "Network Planning", "q": "What does a 'Milestone' represent in a project network diagram?", "o": ["A. A major event or point in time with zero duration", "B. A complex task lasting several weeks", "C. A resource constraint", "D. A sub-contractor agreement"], "a": 0}, {"n": 104, "c": "Network Planning", "q": "Which logical dependency relationship is the most common in project sequencing?", "o": ["A. Finish-to-Start (FS)", "B. Start-to-Start (SS)", "C. Finish-to-Finish (FF)", "D. Start-to-Finish (SF)"], "a": 0}, {"n": 105, "c": "Network Planning", "q": "What does a Finish-to-Start (FS) relationship mean between Task A and Task B?", "o": ["A. Task B cannot start until Task A finishes", "B. Task B cannot start until Task A starts", "C. Task B finishes when Task A finishes", "D. Task A starts when Task B finishes"], "a": 0}, {"n": 106, "c": "Network Planning", "q": "What does a Start-to-Start (SS) relationship indicate?", "o": ["A. Task B cannot start until Task A has started", "B. Task B finishes when Task A starts", "C. Task B starts when Task A finishes", "D. Both tasks must finish together"], "a": 0}, {"n": 107, "c": "Network Planning", "q": "What does a Finish-to-Finish (FF) relationship specify?", "o": ["A. Task B cannot finish until Task A has finished", "B. Task B cannot start until Task A starts", "C. Task A starts when Task B finishes", "D. Task B starts when Task A finishes"], "a": 0}, {"n": 108, "c": "Network Planning", "q": "Which dependency type is extremely rare and dictates that Task B cannot finish until Task A starts?", "o": ["A. Start-to-Finish (SF)", "B. Finish-to-Start (FS)", "C. Start-to-Start (SS)", "D. Finish-to-Finish (FF)"], "a": 0}, {"n": 109, "c": "Network Planning", "q": "What is 'Lead Time' in schedule dependency logic?", "o": ["A. A acceleration of a successor activity allowing it to start before the predecessor finishes", "B. A mandatory delay between tasks", "C. The slack available on non-critical path", "D. The time needed to hire a team"], "a": 0}, {"n": 110, "c": "Network Planning", "q": "What is 'Lag Time' in scheduling logic?", "o": ["A. A mandatory delay that pushes back a successor activity (e.g., concrete curing time)", "B. The speed of task execution", "C. Crashing a task duration", "D. Overlapping activities to save time"], "a": 0}, {"n": 111, "c": "Network Planning", "q": "In an Activity-on-Node (AON) diagram, what represent the activities?", "o": ["A. Nodes / Blocks", "B. Arrows / Lines", "C. Background grid", "D. Document footers"], "a": 0}, {"n": 112, "c": "Network Planning", "q": "In an Activity-on-Arrow (AOA) diagram, what do the arrows represent?", "o": ["A. Project activities", "B. Milestones / Events", "C. Slack time", "D. Resource pools"], "a": 0}, {"n": 113, "c": "Network Planning", "q": "What is a 'Dummy Activity' in AOA network planning?", "o": ["A. A zero-duration, zero-cost task used solely to show logical relationships between nodes", "B. An unapproved extra work package", "C. A task assigned to trainees", "D. An error in network logic"], "a": 0}, {"n": 114, "c": "Network Planning", "q": "Which relationship type is enforced by physical or legal necessity (e.g., building foundation before walls)?", "o": ["A. Mandatory Dependency / Hard Logic", "B. Discretionary Dependency / Soft Logic", "C. External Dependency", "D. Preferred Logic"], "a": 0}, {"n": 115, "c": "Network Planning", "q": "Which dependency type is based on preferred practices or protocol rather than physical necessity?", "o": ["A. Discretionary Dependency / Soft Logic", "B. Mandatory Dependency", "C. Hard Logic", "D. Regulatory Dependency"], "a": 0}, {"n": 116, "c": "Network Planning", "q": "A dependency involving a relationship between project activities and non-project external activities is a:", "o": ["A. External Dependency", "B. Internal Dependency", "C. Soft Logic", "D. Discretionary Dependency"], "a": 0}, {"n": 117, "c": "Network Planning", "q": "When drawing a network diagram, what is a 'Burst Node'?", "o": ["A. A node that has multiple successor activities branching out from it", "B. A node where multiple predecessor activities merge", "C. A task with negative slack", "D. A failed project activity"], "a": 0}, {"n": 118, "c": "Network Planning", "q": "What is a 'Merge Node' in a project network diagram?", "o": ["A. A node where multiple predecessor activities enter into a single successor activity", "B. A node that splits into multiple tasks", "C. A node with no predecessors", "D. A task on the critical path"], "a": 0}, {"n": 119, "c": "Network Planning", "q": "Why are merge nodes considered points of schedule risk?", "o": ["A. The successor task cannot start until ALL entering predecessor tasks are completed", "B. Merge nodes automatically double task duration", "C. Merge nodes eliminate slack", "D. Merge nodes cost twice as much"], "a": 0}, {"n": 120, "c": "Network Planning", "q": "What is a loop or cycle in a network diagram, and why is it disallowed?", "o": ["A. A path that leads back to a previous node; disallowed because it creates an infinite logical loop", "B. A parallel task sequence; disallowed due to cost", "C. A dummy arrow; disallowed in AON", "D. A mandatory delay; disallowed in fast tracking"], "a": 0}, {"n": 121, "c": "Network Planning", "q": "Which network diagramming technique is also known as the Precedence Diagramming Method (PDM)?", "o": ["A. Activity-on-Node (AON)", "B. Activity-on-Arrow (AOA)", "C. Bar Chart Method", "D. PERT Chart Only"], "a": 0}, {"n": 122, "c": "Network Planning", "q": "In precedence diagramming, if Task A (duration 4 days) has an FS relationship with Task B, and there is 2 days of Lag, when does Task B start relative to Task A's start?", "o": ["A. Day 6 (4 days duration + 2 days lag)", "B. Day 4", "C. Day 2", "D. Day 8"], "a": 0}, {"n": 123, "c": "Network Planning", "q": "If Task A has an FS relationship with Task B, but has 1 day of Lead time, when does Task B start if Task A lasts 5 days?", "o": ["A. Day 4 (1 day before Task A finishes)", "B. Day 5", "C. Day 6", "D. Day 1"], "a": 0}, {"n": 124, "c": "Network Planning", "q": "What error occurs if a project network diagram has a task with no successor (except the end node)?", "o": ["A. Dangling task / Dangling path", "B. Circular loop", "C. Dummy convergence", "D. Redundant merge"], "a": 0}, {"n": 125, "c": "Network Planning", "q": "Network diagrams assist project managers primarily by revealing:", "o": ["A. Task sequence, dependencies, and critical path timing", "B. Individual hourly worker wage rates", "C. Hardware serial numbers", "D. Executive tax withholdings"], "a": 0}, {"n": 126, "c": "Critical Path Analysis", "q": "What is the Critical Path in a project network diagram?", "o": ["A. The longest path of dependent activities that determines the shortest possible project completion time", "B. The shortest path through the network", "C. The path with the most expensive tasks", "D. The path with the highest safety risk"], "a": 0}, {"n": 127, "c": "Critical Path Analysis", "q": "What is the total slack (float) of activities strictly on the Critical Path under normal baseline conditions?", "o": ["A. Zero slack", "B. Positive slack equal to project length", "C. Negative 10 days", "D. Variable depending on budget"], "a": 0}, {"n": 128, "c": "Critical Path Analysis", "q": "What calculation process moves from project start to end to determine Earliest Start (ES) and Earliest Finish (EF)?", "o": ["A. Forward Pass", "B. Backward Pass", "C. Crashing Pass", "D. Earned Value Analysis"], "a": 0}, {"n": 129, "c": "Critical Path Analysis", "q": "What is the formula to calculate Earliest Finish (EF) given Earliest Start (ES) and Duration (D)?", "o": ["A. $EF = ES + D - 1$ (or $ES + D$ in continuous time)", "B. $EF = ES - D$", "C. $EF = LS + D$", "D. $EF = LF - ES$"], "a": 0}, {"n": 130, "c": "Critical Path Analysis", "q": "During a Forward Pass, if a successor task has multiple predecessors, its Earliest Start (ES) is determined by:", "o": ["A. The MAXIMUM Earliest Finish (EF) among all immediate predecessors", "B. The MINIMUM Earliest Finish (EF) among predecessors", "C. The average EF of predecessors", "D. The EF of the shortest task"], "a": 0}, {"n": 131, "c": "Critical Path Analysis", "q": "What calculation process moves backward from project finish to start to find Latest Start (LS) and Latest Finish (LF)?", "o": ["A. Backward Pass", "B. Forward Pass", "C. Resource Leveling", "D. Fast Tracking"], "a": 0}, {"n": 132, "c": "Critical Path Analysis", "q": "What is the formula for Latest Start (LS) given Latest Finish (LF) and Duration (D)?", "o": ["A. $LS = LF - D + 1$ (or $LF - D$ in continuous time)", "B. $LS = LF + D$", "C. $LS = ES + LF$", "D. $LS = EF - D$"], "a": 0}, {"n": 133, "c": "Critical Path Analysis", "q": "During a Backward Pass, if a task has multiple successor activities, its Latest Finish (LF) is determined by:", "o": ["A. The MINIMUM Latest Start (LS) among all immediate successors", "B. The MAXIMUM Latest Start (LS) among successors", "C. The average LS of successors", "D. The project completion date plus 10 days"], "a": 0}, {"n": 134, "c": "Critical Path Analysis", "q": "What is the formula for Total Slack (Float)?", "o": ["A. $Total\\ Slack = LS - ES$ or $LF - EF$", "B. $Total\\ Slack = EF - ES$", "C. $Total\\ Slack = LF - LS$", "D. $Total\\ Slack = ES + EF$"], "a": 0}, {"n": 135, "c": "Critical Path Analysis", "q": "What does Total Slack represent?", "o": ["A. The amount of time an activity can be delayed without delaying the project finish date", "B. The time a task can be delayed without delaying the immediate successor", "C. The time needed to crash a task", "D. Unused project budget"], "a": 0}, {"n": 136, "c": "Critical Path Analysis", "q": "What is Free Slack (Free Float)?", "o": ["A. The time an activity can be delayed without delaying the Earliest Start (ES) of any immediate successor", "B. The total project contingency buffer", "C. The total time delay allowed before project cancellation", "D. Slack available for critical tasks"], "a": 0}, {"n": 137, "c": "Critical Path Analysis", "q": "Can a project have more than one critical path simultaneously?", "o": ["A. Yes, if multiple parallel paths have the exact same maximum length", "B. No, a project is mathematically limited to one path", "C. Yes, but only in agile projects", "D. No, because critical paths cancel each other out"], "a": 0}, {"n": 138, "c": "Critical Path Analysis", "q": "What happens to project risk when a project has multiple critical paths?", "o": ["A. Risk increases because any delay on ANY of the critical paths delays the project", "B. Risk decreases because tasks balance out", "C. Risk stays exactly zero", "D. Cost drops automatically"], "a": 0}, {"n": 139, "c": "Critical Path Analysis", "q": "What does Negative Slack indicate in a schedule analysis?", "o": ["A. The project is behind schedule relative to a fixed target deadline", "B. The project is ahead of schedule", "C. The schedule has excess buffer time", "D. The critical path has been eliminated"], "a": 0}, {"n": 140, "c": "Critical Path Analysis", "q": "What schedule compression technique adds resources to critical path activities to shorten duration?", "o": ["A. Crashing", "B. Fast Tracking", "C. Resource Leveling", "D. Scope Reduction"], "a": 0}, {"n": 141, "c": "Critical Path Analysis", "q": "What is the primary drawback or risk associated with Crashing a project?", "o": ["A. Increased project cost and increased management overhead", "B. Increased risk of task rework due to overlap", "C. Reduced team salary", "D. Extension of overall schedule"], "a": 0}, {"n": 142, "c": "Critical Path Analysis", "q": "What schedule compression technique overlaps critical path activities that are normally performed sequentially?", "o": ["A. Fast Tracking", "B. Crashing", "C. Resource Leveling", "D. De-scoping"], "a": 0}, {"n": 143, "c": "Critical Path Analysis", "q": "What is the main risk associated with Fast Tracking?", "o": ["A. Increased risk of rework and logic complications", "B. Direct linear cost increase", "C. Loss of critical path", "D. Automatic scope termination"], "a": 0}, {"n": 144, "c": "Critical Path Analysis", "q": "When choosing which activities to Crash, a project manager should select activities on the critical path that have:", "o": ["A. The lowest crash cost per unit of time saved", "B. The highest crash cost", "C. The longest non-critical float", "D. The highest technical complexity"], "a": 0}, {"n": 145, "c": "Critical Path Analysis", "q": "What schedule smoothing technique adjusts task start/finish dates to balance resource demand without changing critical path if possible?", "o": ["A. Resource Leveling", "B. Crashing", "C. Fast Tracking", "D. Scope Creep"], "a": 0}, {"n": 146, "c": "Critical Path Analysis", "q": "Resource leveling applied to a resource-constrained project often causes project duration to:", "o": ["A. Increase / Extend", "B. Decrease / Shorten", "C. Remain permanently zero", "D. Double its budget"], "a": 0}, {"n": 147, "c": "Critical Path Analysis", "q": "If Task A has ES = 5, EF = 12, LS = 8, LF = 15, what is its Total Slack?", "o": ["A. 3 days ($8 - 5$ or $15 - 12$)", "B. 7 days", "C. 0 days", "D. 10 days"], "a": 0}, {"n": 148, "c": "Critical Path Analysis", "q": "If an activity on the critical path takes 3 days longer than estimated, what happens to the total project completion date?", "o": ["A. The completion date is delayed by exactly 3 days", "B. The completion date remains unchanged", "C. The project finishes 3 days early", "D. Non-critical tasks shorten automatically"], "a": 0}, {"n": 149, "c": "Critical Path Analysis", "q": "What is 'Critical Chain Project Management' (CCPM) baseline emphasis?", "o": ["A. Managing resource dependencies and placing buffers (project/feeding buffers) at strategic points", "B. Adding 50% extra cost to every task", "C. Eliminating all task duration estimates", "D. Micro-managing daily attendance"], "a": 0}, {"n": 150, "c": "Critical Path Analysis", "q": "In CCPM, where is the 'Project Buffer' placed?", "o": ["A. At the very end of the project network, between the last task and the final completion date", "B. Inside each individual task estimate", "C. At the start of the project", "D. On non-critical merge nodes only"], "a": 0}, {"n": 151, "c": "Project Tracking & EVM", "q": "What is the primary purpose of Project Tracking and Control?", "o": ["A. To compare actual project performance against planned baselines and take corrective action", "B. To rewrite project objectives daily", "C. To terminate low-performing employees", "D. To avoid reporting to management"], "a": 0}, {"n": 152, "c": "Project Tracking & EVM", "q": "Which project management methodology integrates scope, schedule, and cost measurements to assess project performance?", "o": ["A. Earned Value Management (EVM)", "B. Agile Kanban", "C. Critical Path Method (CPM) alone", "D. Waterfall Life Cycle"], "a": 0}, {"n": 153, "c": "Project Tracking & EVM", "q": "In Earned Value Management, what does Planned Value (PV) represent?", "o": ["A. The authorized budget allocated to scheduled work to be completed by a given date", "B. The actual money spent to date", "C. The value of completed work", "D. The total estimate at completion"], "a": 0}, {"n": 154, "c": "Project Tracking & EVM", "q": "In EVM, what is Earned Value (EV)?", "o": ["A. The measure of work performed expressed in terms of the budget authorized for that work", "B. Total budget allocated for the entire project", "C. Actual cash disbursed from the bank", "D. Forecasted profit margin"], "a": 0}, {"n": 155, "c": "Project Tracking & EVM", "q": "In EVM, what does Actual Cost (AC) measure?", "o": ["A. The realized cost incurred for work performed on an activity during a given time period", "B. Planned budget for future tasks", "C. Estimated cost to complete remaining work", "D. The monetary value of customer satisfaction"], "a": 0}, {"n": 156, "c": "Project Tracking & EVM", "q": "What is the formula for Cost Variance (CV)?", "o": ["A. $CV = EV - AC$", "B. $CV = EV - PV$", "C. $CV = AC - EV$", "D. $CV = PV - AC$"], "a": 0}, {"n": 157, "c": "Project Tracking & EVM", "q": "What does a positive Cost Variance ($CV > 0$) indicate?", "o": ["A. The project is under budget (spending less than planned for completed work)", "B. The project is over budget", "C. The project is behind schedule", "D. The project budget is exhausted"], "a": 0}, {"n": 158, "c": "Project Tracking & EVM", "q": "What is the formula for Schedule Variance (SV)?", "o": ["A. $SV = EV - PV$", "B. $SV = EV - AC$", "C. $SV = PV - EV$", "D. $SV = AC - PV$"], "a": 0}, {"n": 159, "c": "Project Tracking & EVM", "q": "What does a negative Schedule Variance ($SV < 0$) mean?", "o": ["A. The project is behind schedule (less work completed than planned)", "B. The project is ahead of schedule", "C. The project is under budget", "D. The project scope was expanded"], "a": 0}, {"n": 160, "c": "Project Tracking & EVM", "q": "What is the formula for Cost Performance Index (CPI)?", "o": ["A. $CPI = EV / AC$", "B. $CPI = AC / EV$", "C. $CPI = EV / PV$", "D. $CPI = PV / AC$"], "a": 0}, {"n": 161, "c": "Project Tracking & EVM", "q": "A Cost Performance Index ($CPI$) of 1.25 indicates that:", "o": ["A. The project is getting $1.25 worth of work for every $1.00 spent (under budget)", "B. The project is spending $1.25 for every $1.00 of work (over budget)", "C. The project is 25% behind schedule", "D. The project cost has doubled"], "a": 0}, {"n": 162, "c": "Project Tracking & EVM", "q": "What is the formula for Schedule Performance Index (SPI)?", "o": ["A. $SPI = EV / PV$", "B. $SPI = PV / EV$", "C. $SPI = EV / AC$", "D. $SPI = AC / PV$"], "a": 0}, {"n": 163, "c": "Project Tracking & EVM", "q": "An Schedule Performance Index ($SPI$) of 0.80 means:", "o": ["A. The project is progressing at 80% of the planned rate (behind schedule)", "B. The project is 20% under budget", "C. The project is 80% ahead of schedule", "D. The project has zero remaining risk"], "a": 0}, {"n": 164, "c": "Project Tracking & EVM", "q": "What is Budget at Completion (BAC)?", "o": ["A. The total planned budget for the entire project baseline", "B. The total money spent at project conclusion", "C. The current estimate of final project cost", "D. The remaining project contingency reserve"], "a": 0}, {"n": 165, "c": "Project Tracking & EVM", "q": "Under standard EVM assuming future performance will continue at current CPI, what is the formula for Estimate at Completion (EAC)?", "o": ["A. $EAC = BAC / CPI$", "B. $EAC = BAC - EV$", "C. $EAC = AC + BAC$", "D. $EAC = BAC x SPI$"], "a": 0}, {"n": 166, "c": "Project Tracking & EVM", "q": "What is Estimate to Complete (ETC)?", "o": ["A. The expected cost required to finish all remaining project work ($EAC - AC$)", "B. The total original budget", "C. The money already spent on completed work", "D. The difference between PV and EV"], "a": 0}, {"n": 167, "c": "Project Tracking & EVM", "q": "What is Variance at Completion (VAC)?", "o": ["A. $VAC = BAC - EAC$", "B. $VAC = EAC - AC$", "C. $VAC = EV - PV$", "D. $VAC = BAC / CPI$"], "a": 0}, {"n": 168, "c": "Project Tracking & EVM", "q": "What index measures the cost performance that must be achieved on remaining resources to meet specified target (BAC)?", "o": ["A. To-Complete Performance Index (TCPI)", "B. Schedule Performance Index (SPI)", "C. Cost Variance Index (CVI)", "D. Return on Investment (ROI)"], "a": 0}, {"n": 169, "c": "Project Tracking & EVM", "q": "What is the formula for TCPI based on remaining budget (BAC)?", "o": ["A. $TCPI = (BAC - EV) / (BAC - AC)$", "B. $TCPI = (BAC - AC) / (BAC - EV)$", "C. $TCPI = EV / AC$", "D. $TCPI = (EAC - AC) / EV$"], "a": 0}, {"n": 170, "c": "Project Tracking & EVM", "q": "If $EV = $40,000$, $PV = $50,000$, and $AC = $45,000$, what is the project status?", "o": ["A. Behind schedule ($SV = -$10,000$) and over budget ($CV = -$5,000$)", "B. Ahead of schedule and under budget", "C. Behind schedule but under budget", "D. Ahead of schedule but over budget"], "a": 0}, {"n": 171, "c": "Project Tracking & EVM", "q": "In agile tracking, what chart visually shows remaining work versus remaining time in a sprint?", "o": ["A. Burndown Chart", "B. Gantt Chart", "C. Fishbone Diagram", "D. Critical Path Diagram"], "a": 0}, {"n": 172, "c": "Project Tracking & EVM", "q": "What chart tracks completed work accumulating over time toward total project scope?", "o": ["A. Burnup Chart", "B. Milestone Table", "C. PERT Network", "D. RACI Matrix"], "a": 0}, {"n": 173, "c": "Project Tracking & EVM", "q": "What tracking metric represents the average amount of work an agile team completes during a sprint?", "o": ["A. Velocity", "B. Lead Time", "C. Cycle Time", "D. Slack"], "a": 0}, {"n": 174, "c": "Project Tracking & EVM", "q": "What tracking document visually presents high-level Key Performance Indicators (KPIs) to leadership?", "o": ["A. Project Dashboard / Status Report", "B. WBS Dictionary", "C. Purchase Order Ledger", "D. Vendor Timesheet"], "a": 0}, {"n": 175, "c": "Project Tracking & EVM", "q": "Why is Earned Value superior to simply comparing Actual Costs against Planned Budget?", "o": ["A. Because comparing AC to PV ignores how much work was actually accomplished for that spending", "B. Because EV eliminates the need for baseline budgets", "C. Because EV is mandated by tax law", "D. Because AC to PV calculations are impossible"], "a": 0}, {"n": 176, "c": "Change Control & Contracts", "q": "What is the main objective of a formal Change Control System?", "o": ["A. To document, evaluate, approve or reject proposed changes to project baselines", "B. To prevent any changes from ever occurring", "C. To allow developers to change code without approval", "D. To increase project cost automatically"], "a": 0}, {"n": 177, "c": "Change Control & Contracts", "q": "What formal group is responsible for reviewing, evaluating, approving, or rejecting project changes?", "o": ["A. Change Control Board (CCB)", "B. Executive Board of Directors", "C. Quality Control Audit Team", "D. Subcontractor Guild"], "a": 0}, {"n": 178, "c": "Change Control & Contracts", "q": "What document is submitted by stakeholders to request a modification to scope, schedule, or cost?", "o": ["A. Change Request Form", "B. Work Package", "C. Project Charter", "D. Invoice"], "a": 0}, {"n": 179, "c": "Change Control & Contracts", "q": "What is Configuration Management focused on in technical projects?", "o": ["A. Controlling and documenting physical/functional characteristics of deliverables and code versions", "B. Setting employee work hours", "C. Negotiating office rent", "D. Managing corporate marketing campaigns"], "a": 0}, {"n": 180, "c": "Change Control & Contracts", "q": "What is the primary difference between Change Control and Configuration Management?", "o": ["A. Change control targets baselines (scope/cost/schedule); Configuration management targets product specifications and items", "B. Change control is for software; Configuration management is for construction", "C. Change control is optional; Configuration management is illegal", "D. There is no difference"], "a": 0}, {"n": 181, "c": "Change Control & Contracts", "q": "What term describes unauthorized additions to scope that occur when team members add extra features without client request ('freebies')?", "o": ["A. Gold Plating", "B. Scope Creep", "C. Crashing", "D. Fast Tracking"], "a": 0}, {"n": 182, "c": "Change Control & Contracts", "q": "What legal document defines a binding agreement between a buyer and seller for deliverables/services?", "o": ["A. Contract", "B. Memorandum of Understanding (MOU)", "C. WBS Dictionary", "D. Project Charter"], "a": 0}, {"n": 183, "c": "Change Control & Contracts", "q": "In a Fixed-Price (FP) contract, who carries the financial risk of cost overruns?", "o": ["A. Seller / Contractor", "B. Buyer / Client", "C. Project Manager personally", "D. Government regulator"], "a": 0}, {"n": 184, "c": "Change Control & Contracts", "q": "In a Cost-Reimbursable (CR) contract, who bears the primary financial risk of cost growth?", "o": ["A. Buyer / Client", "B. Seller / Contractor", "C. Insurance Provider", "D. Subcontractor"], "a": 0}, {"n": 185, "c": "Change Control & Contracts", "q": "Which contract type pays a fixed rate per hour/day plus actual material costs, combining aspects of FP and CR?", "o": ["A. Time and Materials (T&M) Contract", "B. Fixed Price Incentive Fee (FPIF)", "C. Cost Plus Award Fee (CPAF)", "D. Firm Fixed Price (FFP)"], "a": 0}, {"n": 186, "c": "Change Control & Contracts", "q": "Which contract type is best suited when the project scope is well-defined and unlikely to change?", "o": ["A. Firm Fixed Price (FFP)", "B. Cost Plus Percentage of Cost (CPPC)", "C. Time and Materials (T&M)", "D. Open-ended Purchase Order"], "a": 0}, {"n": 187, "c": "Change Control & Contracts", "q": "Which contract type is appropriate when scope is uncertain and requires emergency flexibility?", "o": ["A. Cost-Reimbursable or Time & Materials", "B. Firm Fixed Price", "C. Lump Sum", "D. Fixed Price with Economic Price Adjustment"], "a": 0}, {"n": 188, "c": "Change Control & Contracts", "q": "What contract clause protects a party from failure to perform due to unforeseen catastrophic acts of nature?", "o": ["A. Force Majeure Clause", "B. Indemnification Clause", "C. Termination for Cause Clause", "D. Liquidated Damages Clause"], "a": 0}, {"n": 189, "c": "Change Control & Contracts", "q": "What contract term specifies pre-agreed financial penalties paid by seller to buyer for schedule delays?", "o": ["A. Liquidated Damages", "B. Retainage Fee", "C. Cost Plus Incentive", "D. Performance Bonus"], "a": 0}, {"n": 190, "c": "Change Control & Contracts", "q": "What procurement document is issued by a buyer to solicit competitive bids/proposals from potential sellers?", "o": ["A. Request for Proposal (RFP) / Request for Quotation (RFQ)", "B. Purchase Order Acceptance", "C. Bill of Lading", "D. Change Order"], "a": 0}, {"n": 191, "c": "Change Control & Contracts", "q": "What procurement document specifies the detailed scope of work required from a vendor?", "o": ["A. Procurement Statement of Work (SOW)", "B. Project Charter", "C. Stakeholder Engagement Plan", "D. Risk Log"], "a": 0}, {"n": 192, "c": "Change Control & Contracts", "q": "What is the purpose of vendor performance evaluations during procurement administration?", "o": ["A. To ensure the seller meets contractual obligations and deliverable standards", "B. To rewrite vendor corporate bylaws", "C. To delay contract payments indefinitely", "D. To eliminate project change control"], "a": 0}, {"n": 193, "c": "Change Control & Contracts", "q": "What is 'Retainage' in construction and procurement contracts?", "o": ["A. A percentage of contract payments withheld until final project completion and verification", "B. A non-refundable advance bonus paid to seller", "C. Tax withheld by municipal government", "D. Expense charged for storing raw materials"], "a": 0}, {"n": 194, "c": "Change Control & Contracts", "q": "What is the final phase of procurement management?", "o": ["A. Contract Closure / Procurement Audit", "B. Vendor Bidding", "C. RFP Issuance", "D. Purchase Order Approval"], "a": 0}, {"n": 195, "c": "Change Control & Contracts", "q": "What is conducted during a Procurement Audit?", "o": ["A. A structured review of the procurement process from solicitation to contract administration to identify successes and failures", "B. An inspection of executive personal bank accounts", "C. A test of raw materials in a laboratory", "D. An evaluation of project manager salary"], "a": 0}, {"n": 196, "c": "Change Control & Contracts", "q": "What document records settled or unsettled claims between buyer and seller at contract end?", "o": ["A. Contract Claims Register / Settlement Document", "B. Initial Bid Proposal", "C. WBS Code", "D. Daily Timesheet"], "a": 0}, {"n": 197, "c": "Change Control & Contracts", "q": "How does a formal change log benefit project managers?", "o": ["A. It tracks all submitted, approved, rejected, and deferred change requests and their impact", "B. It replaces project financial statements", "C. It prevents stakeholders from contacting the team", "D. It automatically codes software"], "a": 0}, {"n": 198, "c": "Change Control & Contracts", "q": "What action should a project manager take when an unapproved change request is verbally demanded by a powerful sponsor?", "o": ["A. Submit the request through the formal Change Control process for impact analysis before implementation", "B. Execute the change immediately without documentation", "C. Refuse to talk to the sponsor ever again", "D. Resign from the project immediately"], "a": 0}, {"n": 199, "c": "Change Control & Contracts", "q": "What is 'Corrective Action' in change control terminology?", "o": ["A. An intentional activity that realigns project performance with the project management plan", "B. A penalty imposed on developers", "C. Redefining baseline scope lower", "D. Eliminating quality inspections"], "a": 0}, {"n": 200, "c": "Change Control & Contracts", "q": "What is 'Preventive Action' in project control?", "o": ["A. An intentional activity that ensures future project performance aligns with the project plan", "B. Fixing a defect already found in testing", "C. Paying vendor penalties early", "D. Canceling project contracts"], "a": 0}], "id": [{"n": 1, "c": "Project Fundamentals", "q": "A temporary effort undertaken to achieve a specific objective or produce a specific result.", "a": "Project"}, {"n": 2, "c": "Project Fundamentals", "q": "The characteristic of a project stating that it has a defined beginning and an end.", "a": "Temporary"}, {"n": 3, "c": "Project Fundamentals", "q": "The characteristic of a project specifying that it aims to achieve a defined goal or outcome.", "a": "Specific Goal / Objective"}, {"n": 4, "c": "Project Fundamentals", "q": "The key inputs required by a project, including people, money, materials, and time.", "a": "Resources"}, {"n": 5, "c": "Project Fundamentals", "q": "The tangible or intangible result, output, or product created at the end of a project.", "a": "Deliverable"}, {"n": 6, "c": "Project Fundamentals", "q": "The application of knowledge, skills, tools, and techniques to project activities to meet requirements.", "a": "Project Management"}, {"n": 7, "c": "Project Fundamentals", "q": "The initial phase of the project lifecycle where the core problem and project need are identified.", "a": "Initiation Phase"}, {"n": 8, "c": "Project Fundamentals", "q": "The project lifecycle phase focused on defining how the work will be executed and scheduled.", "a": "Planning Phase"}, {"n": 9, "c": "Project Fundamentals", "q": "The project lifecycle phase where the actual work and development tasks are carried out.", "a": "Execution Phase"}, {"n": 10, "c": "Project Fundamentals", "q": "The project lifecycle phase where actual progress is checked against the approved project plan.", "a": "Monitoring and Control Phase"}, {"n": 11, "c": "Project Fundamentals", "q": "The final project lifecycle phase where deliverables are turned over and the project is finished.", "a": "Closing Phase"}, {"n": 12, "c": "Project Fundamentals", "q": "The domino effect of consequences when project management is absent, starting from project delay.", "a": "Project Delay -> Extra Cost -> Conflict -> Poor Quality -> Possible Failure"}, {"n": 13, "c": "Project Fundamentals", "q": "Example category of computer engineering project involving hardware circuits and microcontrollers integrated with software.", "a": "Embedded System / IoT System"}, {"n": 14, "c": "Project Fundamentals", "q": "Example category of computer engineering project focused on handheld smart device applications.", "a": "Mobile Application"}, {"n": 15, "c": "Project Fundamentals", "q": "Example category of computer engineering project focused on physical automation and sensor-actuator control.", "a": "Robotics Project"}, {"n": 16, "c": "Project Fundamentals", "q": "Example category of computer engineering project setting up physical or wireless communication infrastructure.", "a": "Network Installation"}, {"n": 17, "c": "Project Fundamentals", "q": "Execution problem occurring when team members do not know who is assigned to specific tasks.", "a": "Undefined Responsibilities"}, {"n": 18, "c": "Project Fundamentals", "q": "Execution problem occurring when a project lacks a target completion date or timeline.", "a": "No Deadline"}, {"n": 19, "c": "Project Fundamentals", "q": "Execution problem occurring when project costs and expenditures are not estimated or managed.", "a": "No Budget Plan"}, {"n": 20, "c": "Project Fundamentals", "q": "Execution problem occurring when necessary hardware parts, software licenses, or tools are missing.", "a": "Component Unavailability"}, {"n": 21, "c": "Project Fundamentals", "q": "Execution problem where project features or requirements continuously expand without approval.", "a": "Uncontrolled Scope / Requirements Creep"}, {"n": 22, "c": "Project Fundamentals", "q": "Primary cause of team confusion where members make statements like 'I thought you were doing it.'", "a": "Lack of Defined Responsibilities"}, {"n": 23, "c": "Project Fundamentals", "q": "Common team communication issue characterized by statements like 'I didn't know' or 'Nobody told me.'", "a": "Poor Communication"}, {"n": 24, "c": "Project Fundamentals", "q": "A target completion date established without considering actual work volume, resources, or complexity.", "a": "Unrealistic Deadline"}, {"n": 25, "c": "Project Fundamentals", "q": "Negative consequence of rushing development work to meet an unrealistic deadline.", "a": "Poor-Quality Work / Skipped Testing"}, {"n": 26, "c": "Project Fundamentals", "q": "Specifications or user expectations that are ambiguous or incompletely defined prior to development.", "a": "Unclear Requirements"}, {"n": 27, "c": "Project Fundamentals", "q": "The primary stakeholder expectation that fails when a product is built under unclear requirements.", "a": "Client Expectations / User Satisfaction"}, {"n": 28, "c": "Project Fundamentals", "q": "The condition of a system that is technically finished but experiences crashes, data loss, or missing records.", "a": "Poor Quality / Failed Project"}, {"n": 29, "c": "Project Fundamentals", "q": "The main reason a project is not deemed successful even if development work is 100% completed.", "a": "Unmet Quality / Client Dissatisfaction"}, {"n": 30, "c": "Project Fundamentals", "q": "What project managers and teams must thoroughly understand before starting actual project development.", "a": "Project Objectives / Scope"}, {"n": 31, "c": "PM Principles & Benefits", "q": "Principle #1 requiring a well-defined goal that directs all project decisions and efforts.", "a": "Clear Objectives"}, {"n": 32, "c": "PM Principles & Benefits", "q": "Principle #2 emphasizing thorough preparation, scoping, and scheduling before work begins.", "a": "Proper Planning"}, {"n": 33, "c": "PM Principles & Benefits", "q": "Principle #3 assigning distinct roles to ensure every team member understands 'who does what'.", "a": "Defined Responsibilities"}, {"n": 34, "c": "PM Principles & Benefits", "q": "Principle #4 ensuring transparent, continuous sharing of progress, problems, and decisions.", "a": "Effective Communication"}, {"n": 35, "c": "PM Principles & Benefits", "q": "Principle #5 focusing on identifying, analyzing, and preparing for potential issues before they occur.", "a": "Risk Management"}, {"n": 36, "c": "PM Principles & Benefits", "q": "Principle #6 actively evaluating performance against the baseline rather than waiting for the deadline.", "a": "Monitoring & Control"}, {"n": 37, "c": "PM Principles & Benefits", "q": "Principle #7 ensuring deliverables meet specified requirements, standards, and user expectations.", "a": "Quality Management"}, {"n": 38, "c": "PM Principles & Benefits", "q": "Project role responsible for overall project coordination, scheduling, leadership, and tracking.", "a": "Project Manager"}, {"n": 39, "c": "PM Principles & Benefits", "q": "Project role responsible for designing physical circuitry, sensors, and hardware components.", "a": "Hardware Engineer"}, {"n": 40, "c": "PM Principles & Benefits", "q": "Project role responsible for writing application code, logic, and software algorithms.", "a": "Programmer / Software Developer"}, {"n": 41, "c": "PM Principles & Benefits", "q": "Project role responsible for designing database schemas, tables, queries, and data storage.", "a": "Database Administrator / Developer"}, {"n": 42, "c": "PM Principles & Benefits", "q": "Project role responsible for authoring user manuals, technical reports, and project records.", "a": "Documentation Specialist"}, {"n": 43, "c": "PM Principles & Benefits", "q": "The sequential flow of effective communication: Progress -> Problems -> Discussion -> Decision -> ?", "a": "Action"}, {"n": 44, "c": "PM Principles & Benefits", "q": "Key benefit of project management enabling teams to schedule work efficiently and hit milestones.", "a": "Better Time Management"}, {"n": 45, "c": "PM Principles & Benefits", "q": "Key benefit of project management eliminating overlap and task ownership confusion.", "a": "Clear Responsibilities"}, {"n": 46, "c": "PM Principles & Benefits", "q": "Key benefit of project management ensuring optimal deployment of personnel, equipment, and funds.", "a": "Better Resource Utilization"}, {"n": 47, "c": "PM Principles & Benefits", "q": "Key benefit of project management reducing the impact and likelihood of unexpected project failures.", "a": "Reduced Risks"}, {"n": 48, "c": "PM Principles & Benefits", "q": "Key benefit of project management fostering alignment, teamwork, and prompt problem resolution.", "a": "Better Communication"}, {"n": 49, "c": "PM Principles & Benefits", "q": "Key benefit of project management resulting in robust, reliable, and defect-free deliverables.", "a": "Improved Quality"}, {"n": 50, "c": "PM Principles & Benefits", "q": "The ultimate strategic benefit achieved by applying disciplined project management principles.", "a": "Higher Chance of Success"}, {"n": 51, "c": "PM Principles & Benefits", "q": "The core mindset of Risk Management: 'Risk management doesn't mean preventing every problem. It means...'", "a": "Preparing for problems before they happen"}, {"n": 52, "c": "PM Principles & Benefits", "q": "The core rule of Proper Planning: 'Don't start the project before...'", "a": "You understand the project"}, {"n": 53, "c": "PM Principles & Benefits", "q": "Corrective action step taken when tracking reveals programming is only 60% complete near deadline.", "a": "Identify Cause and Reassign Resources / Adjust Schedule"}, {"n": 54, "c": "PM Principles & Benefits", "q": "The principle stating that monitoring is NOT waiting until project end, but rather continuous...", "a": "Tracking and Intervention"}, {"n": 55, "c": "PM Principles & Benefits", "q": "What quality management satisfies beyond mere technical software completion.", "a": "Client and User Expectations"}, {"n": 56, "c": "PM Principles & Benefits", "q": "System attribute evaluated during quality checks to ensure data is retrieved without crashing.", "a": "System R const S={set:'mc',mode:'study',cat:'',shuf:false,deck:[],i:0,shown:false,score:0,missed:[],answered:false,done:false,q:'',reveal:true};
const $=s=>document.querySelector(s),V=$('#view');
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function build(items){S.deck=items||(()=>{let d=DATA[S.set].filter(x=>!S.cat||x.c===S.cat);return S.shuf?shuffle(d):d})();S.i=0;S.shown=false;S.score=0;S.missed=[];S.answered=false;S.done=false;render()}
function cats(){const c=[...new Set(DATA[S.set].map(x=>x.c))];$('#cat').innerHTML='<option value="">All topics ('+DATA[S.set].length+')</option>'+c.map(x=>`<option ${x===S.cat?'selected':''}>${esc(x)}</option>`).join('')}
function sync(){document.querySelectorAll('#setSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.set));document.querySelectorAll('#modeSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.mode));$('#count').textContent=S.deck.length+' items'}
function render(){sync();({study,flash,quiz})[S.mode]()}
function ansText(x){return S.set==='mc'?x.o[x.a]:x.a}
function study(){
 const q=S.q.toLowerCase();const list=S.deck.filter(x=>!q||(x.q+' '+ansText(x)).toLowerCase().includes(q));
 V.innerHTML=`<div class="bar"><input type="search" id="sq" placeholder="Search questions or answers" value="${esc(S.q)}" style="flex:1"><label class="chk"><input type="checkbox" id="rv" ${S.reveal?'checked':''}> Show answers</label></div>`+
 list.map(x=>`<div class="card"><div class="meta">#${x.n} · ${esc(x.c)}</div><p class="q">${esc(x.q)}</p>`+
  (S.set==='mc'?x.o.map(o=>`<div style="padding:2px 0">${esc(o)}</div>`).join(''):'')+`<details style="margin-top:8px" ${S.reveal?'open':''}><summary>Show answer</summary><div class="ans">${esc(ansText(x))}</div></details>`+`</div>`).join('')||'<div class="card">No matches.</div>';
 $('#sq').oninput=e=>{S.q=e.target.value;const p=e.target.selectionStart;study();const n=$('#sq');n.focus();n.setSelectionRange(p,p)};
 $('#rv').onchange=e=>{S.reveal=e.target.checked;study()};
}
function flash(){
 const x=S.deck[S.i];if(!x){V.innerHTML='<div class="card">No items.</div>';return}
 V.innerHTML=`<div class="prog"><i style="width:${(S.i+1)/S.deck.length*100}%"></i></div>
 <div class="card flash" id="fc" tabindex="0" role="button" aria-label="Flip card"><div class="meta">#${x.n} · ${esc(x.c)} · ${S.i+1}/${S.deck.length}</div>
 ${S.shown?`<div class="big ans">${esc(ansText(x))}</div><div class="meta">${esc(x.q)}</div>`:`<p class="q">${esc(x.q)}</p><div class="meta">Tap to reveal answer</div>`}</div>
 <div class="row"><button class="btn" id="pv">Previous</button><span class="sp"></span><button class="btn pri" id="nx">Next</button></div>`;
 const fl=()=>{S.shown=!S.shown;flash()};$('#fc').onclick=fl;$('#fc').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fl()}};
 $('#pv').onclick=()=>{S.i=(S.i-1+S.deck.length)%S.deck.length;S.shown=false;flash()};
 $('#nx').onclick=()=>{S.i=(S.i+1)%S.deck.length;S.shown=false;flash()};
}
const norm=t=>String(t).toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function quiz(){
 if(!S.deck.length){V.innerHTML='<div class="card">No items.</div>';return}
 if(S.done){const n=S.deck.length,p=Math.round(S.score/n*100);
  V.innerHTML=`<div class="card"><div class="meta">Quiz finished</div><div class="big">${S.score} / ${n} (${p}%)</div><div class="row" style="margin-top:12px"><button class="btn pri" id="rs">Restart</button>${S.missed.length?`<button class="btn" id="rm">Retry ${S.missed.length} missed</button>`:''}</div></div>`+
  S.missed.map(x=>`<div class="card"><div class="meta">#${x.n} · ${esc(x.c)}</div><p class="q">${esc(x.q)}</p><div class="ans">${esc(ansText(x))}</div></div>`).join('');
  $('#rs').onclick=()=>build();if(S.missed.length)$('#rm').onclick=()=>build(shuffle(S.missed));return}
 const x=S.deck[S.i];
 let h=`<div class="prog"><i style="width:${S.i/S.deck.length*100}%"></i></div><div class="card"><div class="meta">#${x.n} · ${esc(x.c)} · ${S.i+1}/${S.deck.length} · score ${S.score}</div><p class="q">${esc(x.q)}</p>`;
 if(S.set==='mc'){h+=x.o.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')}
 else{h+=`<input type="text" id="gi" placeholder="Type your answer" style="width:100%" autocomplete="off"><div class="row" style="margin-top:10px"><button class="btn pri" id="ck">Check answer</button></div><div id="fbk"></div>`}
 h+=`<div class="row" style="margin-top:10px"><span class="sp"></span><button class="btn pri" id="nq" style="display:none">${S.i+1===S.deck.length?'Finish':'Next'}</button></div></div>`;
 V.innerHTML=h;S.answered=false;
 const nxt=()=>{S.i++;if(S.i>=S.deck.length)S.done=true;quiz()};$('#nq').onclick=nxt;
 const grade=ok=>{if(S.answered)return;S.answered=true;ok?S.score++:S.missed.push(x);$('#nq').style.display='';$('#nq').focus()};
 if(S.set==='mc'){document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;document.querySelectorAll('.opt').forEach(o=>{o.disabled=true;if(+o.dataset.k===x.a)o.classList.add('right')});if(k!==x.a)b.classList.add('wrong');grade(k===x.a)})}
 else{
  const gi=$('#gi');gi.focus();
  const check=()=>{if(S.answered||$('#ck').dataset.done)return;$('#ck').dataset.done=1;$('#ck').style.display='none';gi.readOnly=true;
   const g=norm(gi.value),a=norm(x.a),close=g&&(g===a||(g.length>3&&(a.includes(g)||g.includes(a))));
   $('#fbk').innerHTML=`<div class="fb ${close?'ok':'no'}">${close?'Looks right.':'Not an exact match.'} Answer: <b class="ans">${esc(x.a)}</b></div><div class="row"><span class="meta">Mark yourself:</span><button class="btn ok" id="gy">I got it</button><button class="btn no" id="gn">I missed it</button></div>`;
   $('#gy').onclick=()=>{grade(true);$('#fbk').querySelector('.row').remove()};$('#gn').onclick=()=>{grade(false);$('#fbk').querySelector('.row').remove()};};
  $('#ck').onclick=check;gi.onkeydown=e=>{if(e.key==='Enter')check()};
 }
}
document.querySelectorAll('#setSeg button').forEach(b=>b.onclick=()=>{S.set=b.dataset.v;S.cat='';S.q='';cats();build()});
document.querySelectorAll('#modeSeg button').forEach(b=>b.onclick=()=>{S.mode=b.dataset.v;build()});
$('#cat').onchange=e=>{S.cat=e.target.value;build()};
$('#shuf').onchange=e=>{S.shuf=e.target.checked;build()};
cats();build();
</script></body></html>
